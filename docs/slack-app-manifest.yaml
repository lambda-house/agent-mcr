# Slack app for the harness's Slack connector (decision D14, docs/AGENT_HARNESS_DESIGN.md).
# Create it at https://api.slack.com/apps > Create New App > From a manifest.
# The app-level token (scope connections:write) is created by hand afterwards:
# Basic Information > App-Level Tokens.
display_information:
  name: TEOB HQ
  description: Connects the coding-agent sessions on your Mac to chosen channels
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: TEOB HQ
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - member_joined_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false

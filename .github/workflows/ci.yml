name: CI

on:
  push:
    branches: [main, windows-port, windows-port-b]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Authenticate private dependencies
        env:
          TEOB_UI_TOKEN: ${{ secrets.TEOB_UI_TOKEN }}
        run: git config --global url."https://x-access-token:${TEOB_UI_TOKEN}@github.com/teob-cc/".insteadOf "https://github.com/teob-cc/"

      - run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Lint Rust backend
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Authenticate private dependencies
        shell: bash
        env:
          TEOB_UI_TOKEN: ${{ secrets.TEOB_UI_TOKEN }}
        run: git config --global url."https://x-access-token:${TEOB_UI_TOKEN}@github.com/teob-cc/".insteadOf "https://github.com/teob-cc/"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Lint Rust backend
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

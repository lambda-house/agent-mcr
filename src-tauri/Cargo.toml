[package]
name = "agent-mcr"
version = "0.1.1"
description = "Agent Mission Control Room"
authors = ["Lambda House"]
license = "MIT"
repository = "https://github.com/lambda-house/agent-mcr"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
notify = { version = "6.0", default-features = false, features = ["macos_fsevent"] }
dirs = "5.0"
chrono = "0.4"
encoding_rs = "0.8"
dunce = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
portable-pty = "0.9"
libc = "0.2"
vt100 = "0.18.1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
security-framework = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
glib-sys = "0.22.9"
glib = "0.22.10"
gobject-sys = "0.22.9"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
sysinfo = "0.33"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

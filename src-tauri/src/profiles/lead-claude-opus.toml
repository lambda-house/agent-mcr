# A lead below the root Supervisor: runs one track with its own executors
# through the mcr task tools (owner's decision 16697 B). Like an implementer
# that has executors; never the root Supervisor.
# It delivers its track (MCR-136, owner's decision of 2026-11-23): it pushes
# and merges a commit an independent validator approved, under the delivery
# contract of its role guide, so merge and push are not owner words for it.
# Force pushes, mirror and prune pushes and deleting main are denied,
# best-effort (M2; FORCE_PUSH_DENIES in profiles.rs, which check() requires).
# Claude Code's `*` matches any text, spaces included; a form that may follow
# `push` directly has a rule of its own. Not caught: `git -C <dir> push`,
# `git -c ... push`, git aliases, scripts, bundled short flags (`-uf`) and
# ref updates through `gh api`. The boundary is the protection of main.
id = "lead@claude-opus"
version = 2
role = "lead"
adapter = "claude"
summary = "Leads one track below the Supervisor with its own executors; delivers what an independent validator approved"

[inference]
model = "opus"
effort = "high"

[permissions]
mode = "acceptEdits"
push = "delivery"

[tools]
deny = [
    "Bash(git push*--force*)",
    "Bash(git push -f*)",
    "Bash(git push* -f*)",
    "Bash(git push +*)",
    "Bash(git push* +*)",
    "Bash(git push*--mirror*)",
    "Bash(git push*--prune*)",
    "Bash(git push*--delete*main)",
    "Bash(git push* -d*main)",
    "Bash(git push* :main)",
    "Bash(git push* :refs/heads/main)",
]

[context]
skills = ["main-line", "discovered-work", "close-out"]

[contract]
done = ["refs", "unverified"]
report_status_every_min = 60

[limits]
max_executors = 12
